spring:
  application:
    name: class-member-backend
  config:
    # 数据库密码等敏感配置放在 application-local.yml（已 gitignore，不入库）
    import: optional:classpath:application-local.yml
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/class_mgmt?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: ""
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        # avoid re-tightening large text columns on restart
        jdbc:
          batch_size: 20
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 200MB

server:
  address: 127.0.0.1
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true
      enabled: true

app:
  access-password: ""
  seed-sample: true
  cors-allowed-origins: "http://localhost:5173,http://127.0.0.1:5173"
  # 上传目录：留空/省略时使用 <运行目录>/uploads/announcements，可在 application-local.yml 覆盖
  # OCR：默认优先 Windows 系统自带 OCR（无需额外安装），Tesseract 仅作回退（可选）。
  # 安装 Tesseract 后若未加入 PATH，请在 application-local.yml 覆盖 executable 与 tessdata
  tesseract:
    executable: "tesseract"
    lang: "chi_sim+eng"
    psm: "6"

